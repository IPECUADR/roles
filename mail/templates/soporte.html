<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ticket de Soporte</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8;">

  <!-- Wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f6f8">
    <tr>
      <td align="center">

        <!-- Container -->
        <table role="presentation"
               width="600"
               cellpadding="0"
               cellspacing="0"
               bgcolor="#ffffff"
               style="margin:40px auto; border:1px solid #e0e0e0;">

          <!-- Header -->
          <tr>
           <td bgcolor="#093B8E" style="padding:24px;">
   <table role="presentation" cellpadding="0" cellspacing="0">
     <tr>
      <!-- Logo -->
                      <td valign="middle" style="padding-right:12px;">
                        <img src="https://kluane.itdospuntocero.net/PTH/IMG/kdeValores.png"
                            width="140"
                            style="display:block; border:0;"
                            alt="Kluane Drilling Ecuador">
                      </td>

                      <!-- Texto -->
                      <td valign="middle"
                          style="font-family: Helvetica, Arial, sans-serif;
                                color:#ffffff;
                                font-size:14px;
                                line-height:18px;
                                font-weight:bold;">
                         Gestion Humana <br>
                        <span style="font-weight:normal;">Kluane Drilling Ecuador</span>
                      </td>
                    </tr>
                  </table>
                </td>
          </tr>

          <!-- Title -->
          <tr>
            <td style="padding:24px 24px 8px 24px;
                       font-family:Helvetica, Arial, sans-serif;">
              <h1 style="margin:0;
                         font-size:22px;
                         color:#093B8E;">
                🎫 RECUPERACION  DE CONTRASEÑA
              </h1>
            </td>
          </tr>

          <!-- Metadata -->
          <tr>
            <td style="padding:0 24px 24px 24px;
                       font-family:Helvetica, Arial, sans-serif;
                       font-size:14px;
                       color:#555555;">
              <p style="margin:4px 0;">
                <strong>Colaborador:</strong> {{nombre}}
              </p>
           
              <p style="margin:4px 0;">
                <strong>Fecha:</strong> {{fecha}}
              </p>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="padding:0 24px 24px 24px;
                       font-family:Helvetica, Arial, sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0"
                     style="border:1px solid #dcdcdc;">
                <tr>
                  <td style="padding:16px;
                             font-size:15px;
                             color:#333333;
                             line-height:22px;">
                     <strong>Codigo de Recuperacion:    {{token}}</strong> 
                       <br>

                     
                        <p>
                          <small>Tu código de recuperación es único y estará disponible durante <strong>10 minutos</strong></small>.
                        </p>

                     
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px;
                       font-family:Helvetica, Arial, sans-serif;
                       font-size:12px;
                       color:#777777;
                       text-align:center;
                       background-color:#f9f9f9;">
              KLUANE DRILLING ECUADOR<br>
              Gestion Humana · Quito – Ecuador
            </td>
          </tr>

        </table>
        <!-- /Container -->

      </td>
    </tr>
  </table>
  <!-- /Wrapper -->

</body>
</html>
