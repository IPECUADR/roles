<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KD TE ESCUCHA</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8;">

<!-- Wrapper -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f6f8">
  <tr>
    <td align="center">

      <!-- Container -->
      <table role="presentation"
             width="600"
             cellpadding="0"
             cellspacing="0"
             bgcolor="#ffffff"
             style="margin:40px auto; border-radius:6px; border:1px solid #e0e0e0;">

        <!-- Header -->
        <tr>
          <td bgcolor="#1da1f2" style="padding:26px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td valign="middle" style="padding-right:14px;">
                  <img src="https://kluane.itdospuntocero.net/KDE/IMG/kde.png"
                       width="140"
                       style="display:block; border:0;"
                       alt="Kluane Drilling Ecuador">
                </td>
                <td valign="middle"
                    style="font-family: Helvetica, Arial, sans-serif;
                           color:#ffffff;
                           font-size:18px;
                           line-height:22px;
                           font-weight:bold;">
                  Gestión Humana<br>
                  <span style="font-size:14px; font-weight:normal; opacity:0.9;">
                    Kluane Drilling Ecuador
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Title -->
        <tr>
          <td style="padding:28px 24px 10px 24px;
                     font-family:Helvetica, Arial, sans-serif;">
            <h1 style="margin:0;
                       font-size:22px;
                       color:#093B8E;">
              🎫 Nueva Queja / Sugerencia
            </h1>
          </td>
        </tr>

        <!-- Metadata -->
        <tr>
          <td style="padding:0 24px 24px 24px;
                     font-family:Helvetica, Arial, sans-serif;
                     font-size:14px;
                     color:#555555;">
            <p style="margin:6px 0;">
              <strong>Colaborador:</strong> {{nombre}}
            </p>
            <p style="margin:6px 0;">
              <strong>Fecha:</strong> {{fecha}}
            </p>
          </td>
        </tr>

        <!-- Message -->
        <tr>
          <td style="padding:0 24px 28px 24px;
                     font-family:Helvetica, Arial, sans-serif;">

            <table width="100%" cellpadding="0" cellspacing="0"
                   style="border:1px solid #e1e1e1; border-radius:4px; background-color:#fafafa;">

              <tr>
                <td style="padding:16px;
                           font-size:15px;
                           color:#333333;
                           line-height:22px;">
                  <strong style="color:#093B8E;">Queja:</strong><br>
                  {{qj}}
                </td>
              </tr>

              <tr>
                <td style="padding:16px;
                           font-size:15px;
                           color:#333333;
                           line-height:22px;
                           border-top:1px solid #dddddd;">
                  <strong style="color:#093B8E;">Sugerencia:</strong><br>
                  {{sg}}
                </td>
              </tr>

              <!-- Button -->
              <tr>
                <td align="center" style="padding:24px; border-top:1px solid #dddddd;">
                  <table cellpadding="0" cellspacing="0">
                    <tr>
                      <td bgcolor="#093B8E"
                          style="padding:12px 24px;
                                 border-radius:4px;
                                 text-align:center;">
                        <a href="https://kluane.itdospuntocero.net/KDE/CONTROLLERS/Admin_Login.php"
                           style="font-family:Helvetica, Arial, sans-serif;
                                  font-size:14px;
                                  color:#ffffff;
                                  text-decoration:none;
                                  font-weight:bold;
                                  display:inline-block;">
                          Atender Petición
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>

          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:20px;
                     font-family:Helvetica, Arial, sans-serif;
                     font-size:12px;
                     color:#777777;
                     text-align:center;
                     background-color:#f9f9f9;">
            <strong>KLUANE DRILLING ECUADOR</strong><br>
            Gestión Humana · Quito – Ecuador
          </td>
        </tr>

      </table>
      <!-- /Container -->

    </td>
  </tr>
</table>
<!-- /Wrapper -->

</body>
</html>
